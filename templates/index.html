<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Car Valuation Platform - Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans">
    
    <!-- Navbar -->
    <nav class="border-b border-zinc-800 bg-zinc-900/50 backdrop-blur px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="bg-orange-600 text-white font-bold px-3 py-1 rounded-lg text-sm">AI</span>
            <h1 class="font-bold text-lg tracking-wide">Car Valuation Platform</h1>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-sm text-zinc-400">Welcome, <span id="usernameDisplay" class="text-zinc-200 font-semibold">user</span></span>
            <a href="/login" class="bg-zinc-800 hover:bg-zinc-700 text-sm px-4 py-2 rounded-lg transition">Log Out</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto p-6 mt-6">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-xl">
            <h2 class="text-xl font-bold mb-1">AI Price Prediction Calculator</h2>
            <p class="text-sm text-zinc-400 mb-6">Select car specifications to estimate market valuation using Random Forest AI.</p>
            
            <!-- Prediction Form -->
            <form id="predictionForm" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-2">Car Model</label>
                   <select id="modelInput" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-600">
    <!-- Maruti Suzuki -->
    <option value="Maruti Swift VXi">Maruti Swift VXi</option>
    <option value="Maruti Suzuki Brezza">Maruti Suzuki Brezza</option>
    <option value="Maruti Suzuki Fronx">Maruti Suzuki Fronx</option>
    <option value="Maruti Suzuki Jimny">Maruti Suzuki Jimny</option>
    <option value="Maruti Baleno Zeta">Maruti Baleno Zeta</option>
    <option value="Maruti Grand Vitara">Maruti Grand Vitara</option>
    
    <!-- Hyundai -->
    <option value="Hyundai Creta SX">Hyundai Creta SX</option>
    <option value="Hyundai Venue S">Hyundai Venue S</option>
    <option value="Hyundai i20 Asta">Hyundai i20 Asta</option>
    <option value="Hyundai Verna SX">Hyundai Verna SX</option>
    
    <!-- Mahindra -->
    <option value="Mahindra Thar AX">Mahindra Thar AX</option>
    <option value="Mahindra Scorpio-N">Mahindra Scorpio-N</option>
    <option value="Mahindra XUV700">Mahindra XUV700</option>
    
    <!-- Tata & Honda -->
    <option value="Tata Nexon Creative">Tata Nexon Creative</option>
    <option value="Tata Harrier Pure">Tata Harrier Pure</option>
    <option value="Honda City V">Honda City V</option>
    <option value="Honda Elevate ZX">Honda Elevate ZX</option>
    
    <!-- Toyota -->
    <option value="Toyota Fortuner 4x2">Toyota Fortuner 4x2</option>
    <option value="Toyota Innova Hycross">Toyota Innova Hycross</option>
</select>
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-2">Fuel Type</label>
                    <select id="fuelInput" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-600">
                        <option value="Petrol">Petrol</option>
                        <option value="Diesel">Diesel</option>
                        <option value="CNG">CNG</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-2">Transmission Type</label>
                    <select id="transInput" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-600">
                        <option value="Manual">Manual</option>
                        <option value="Automatic">Automatic</option>
                    </select>
                </div>

                <div class="md:col-span-3 mt-2">
                    <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 font-semibold text-white py-3 rounded-xl transition shadow-lg shadow-orange-900/20">
                        Run AI Price Estimation
                    </button>
                </div>
            </form>

            <!-- Results Section -->
            <div id="resultsContainer" class="hidden mt-8 border-t border-zinc-800 pt-6">
                <h3 class="text-sm font-semibold text-zinc-400 uppercase tracking-wider mb-4">Estimated Market Valuation</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-zinc-950 border border-zinc-800 rounded-xl p-4 text-center">
                        <p class="text-xs text-zinc-500 mb-1">Low Range</p>
                        <p id="lowEstimate" class="text-lg font-bold text-zinc-300">₹0.0 L</p>
                    </div>
                    <div class="bg-orange-600/10 border border-orange-600/30 rounded-xl p-4 text-center">
                        <p class="text-xs text-orange-400 font-medium mb-1">Fair Market Valuation</p>
                        <p id="fairPriceDisplay" class="text-2xl font-extrabold text-orange-500">₹0.0 L</p>
                    </div>
                    <div class="bg-zinc-950 border border-zinc-800 rounded-xl p-4 text-center">
                        <p class="text-xs text-zinc-500 mb-1">High Range</p>
                        <p id="highEstimate" class="text-lg font-bold text-zinc-300">₹0.0 L</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- JavaScript Handling API Fetch -->
    <script>
        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                year: 2020,
                kms_driven: 40000,
                fuel_type: document.getElementById('fuelInput').value,
                transmission: document.getElementById('transInput').value,
                target_price: 0
            };

            try {
                const res = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                if(data.status === 'success') {
                    document.getElementById('fairPriceDisplay').innerText = `₹${data.predicted_price} L`;
                    document.getElementById('lowEstimate').innerText = `₹${data.low_estimate} L`;
                    document.getElementById('highEstimate').innerText = `₹${data.high_estimate} L`;
                    document.getElementById('resultsContainer').classList.remove('hidden');
                } else {
                    alert('Error calculating price: ' + data.message);
                }
            } catch (err) {
                console.error('Fetch error:', err);
                alert('Failed to connect to backend server.');
            }
        });
    </script>
</body>
</html>
