<form id="predictionForm" class="space-y-4">
  <!-- Year of Model -->
  <div>
    <label for="year" class="block text-sm font-medium mb-1">Year of Model</label>
    <input
      type="number"
      id="year"
      name="year"
      min="1995"
      max="2026"
      value="2020"
      required
      class="w-full px-3 py-2 rounded bg-slate-800 border border-slate-700 text-white"
    />
  </div>

  <!-- KM Running -->
  <div>
    <label for="kms_driven" class="block text-sm font-medium mb-1">KM Running</label>
    <input
      type="number"
      id="kms_driven"
      name="kms_driven"
      min="0"
      step="100"
      value="45000"
      required
      class="w-full px-3 py-2 rounded bg-slate-800 border border-slate-700 text-white"
    />
  </div>

  <!-- Fuel Selection (Including Diesel) -->
  <div>
    <label for="fuel" class="block text-sm font-medium mb-1">Fuel Type</label>
    <select
      id="fuel"
      name="fuel"
      class="w-full px-3 py-2 rounded bg-slate-800 border border-slate-700 text-white"
    >
      <option value="Petrol">Petrol</option>
      <option value="Diesel" selected>Diesel</option>
      <option value="CNG">CNG</option>
      <option value="Electric">Electric</option>
    </select>
  </div>

  <!-- Transmission -->
  <div>
    <label for="transmission" class="block text-sm font-medium mb-1">Transmission</label>
    <select
      id="transmission"
      name="transmission"
      class="w-full px-3 py-2 rounded bg-slate-800 border border-slate-700 text-white"
    >
      <option value="Manual">Manual</option>
      <option value="Automatic">Automatic</option>
    </select>
  </div>

  <button
    type="submit"
    class="w-full py-2.5 px-4 rounded bg-blue-600 hover:bg-blue-500 font-semibold text-white"
  >
    Predict Price
  </button>
</form>

<script>
  document.getElementById("predictionForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const formData = new FormData();
    formData.append("year", document.getElementById("year").value);
    formData.append("kms_driven", document.getElementById("kms_driven").value);
    formData.append("fuel", document.getElementById("fuel").value);
    formData.append("transmission", document.getElementById("transmission").value);

    const response = await fetch("/predict", {
      method: "POST",
      body: formData,
    });

    const data = await response.json();
    if (data.status === "success") {
      document.getElementById("fairPriceDisplay").innerText = data.fairPriceDisplay;
      document.getElementById("lowEstDisplay").innerText = data.lowEstDisplay;
      document.getElementById("highEstDisplay").innerText = data.highEstDisplay;
    } else {
      alert("Error: " + data.message);
    }
  });
</script>
