<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Car Valuation AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <nav class="border-b border-zinc-800 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="font-bold text-lg text-orange-500">🚗 Car Valuation AI Platform</span>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-sm text-zinc-400">Welcome, Team</span>
            <a href="/login" class="text-sm bg-red-600 hover:bg-red-700 px-4 py-2 rounded-xl font-medium transition">Log Out</a>
        </div>
    </nav>

    <!-- Main Dashboard Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-2xl bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl">
            <h1 class="text-xl font-bold mb-1">AI Price Prediction Calculator</h1>
            <p class="text-sm text-zinc-400 mb-6">Select car specifications to estimate market valuation using Random Forest AI.</p>

            <!-- Form Fields -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
