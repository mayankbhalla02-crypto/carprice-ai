{% extends "base_auth.html" %}
{% block title %}Sign in - Car price AI{% endblock %}
{% block form %}
<h1>Sign in</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('login') }}">
  <div class="field">
    <label for="username">Email</label>
    <input id="username" name="username" type="email" autocomplete="username" required autofocus>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
  </div>
  <button class="btn" type="submit">Sign in</button>
</form>
<p class="switch">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
<p class="demo">Demo account: <code>demo@carai.com</code> with password <code>demo123</code></p>
{% endblock %}
