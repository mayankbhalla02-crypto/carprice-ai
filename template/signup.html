{% extends "base_auth.html" %}
{% block title %}Create account - Car price AI{% endblock %}
{% block form %}
<h1>Create an account</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('signup') }}">
  <div class="field">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required autofocus>
  </div>
  <div class="field">
    <label for="org_name">Your name or organisation</label>
    <input id="org_name" name="org_name" type="text" autocomplete="organization" placeholder="Optional">
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>
    <p class="hint">At least 6 characters.</p>
  </div>
  <button class="btn" type="submit">Create account</button>
</form>
<p class="switch">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
{% endblock %}
